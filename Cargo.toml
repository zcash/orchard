[package]
name = "orchard"
version = "0.15.5"
authors = [
    "Sean Bowe <ewillbefull@gmail.com>",
    "Jack Grigg <thestr4d@gmail.com>",
    "Daira-Emma Hopwood <daira@jacaranda.org>",
    "Ying Tong Lai",
    "Kris Nuttycombe <kris@nutty.land>",
]
edition = "2021"
rust-version = "1.88"
description = "The Orchard shielded transaction protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/orchard"
documentation = "https://docs.rs/orchard"
readme = "README.md"
categories = ["cryptography::cryptocurrencies"]
keywords = ["zcash"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[dependencies]
aes = "0.9"
ff = { version = "0.14", default-features = false }
fpe = { version = "0.7", default-features = false, features = ["alloc"] }
group = "0.14"
zcash_spec = "0.2.1"

# Circuit
halo2_gadgets = { version = "0.6", optional = true, default-features = false }
halo2_proofs = { version = "0.4", optional = true, default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
pasta_curves = { version = "0.6", features = ["glv"] }
poseidon = { package = "halo2_poseidon", version = "0.2" }
reddsa = { version = "0.6", default-features = false }
sinsemilla = "0.2"

# CSPRNG
rand = { version = "0.10", default-features = false }
rand_core = { version = "0.10", default-features = false }

# Zcash protocol
blake2b_simd = { version = "1", default-features = false }
bitvec = { version = "1", default-features = false }
incrementalmerkletree = "0.9"
zcash_note_encryption = "0.5.1"
zip32 = { version = "0.3", default-features = false }

# Secret management
subtle = { version = "2.6", default-features = false }

# Encodings
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

# Boilerplate
getset = "0.1"
lazy_static = "1"
nonempty = { version = "0.11", default-features = false }
visibility = "0.1.1"
zeroize = { version = "1", optional = true, default-features = false }

# Logging
tracing = { version = "0.1", optional = true, default-features = false }

# No-std support
corez = { version = "0.1.1", default-features = false, features = ["alloc"] }

# Developer tooling dependencies
image = { version = "0.25", optional = true }
plotters = { version = "0.3.0", optional = true }
memuse = { version = "0.2.2", default-features = false }
proptest = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
halo2_gadgets = { version = "0.6", features = ["test-dependencies"] }
hex = "0.4"
proptest = "1"
rand = { version = "0.10", features = ["chacha", "std", "std_rng", "sys_rng", "thread_rng"] }
sinsemilla = { version = "0.2", features = ["test-dependencies"] }
zcash_note_encryption = { version = "0.5.1", features = ["pre-zip-212"] }
incrementalmerkletree = { version = "0.9", features = ["test-dependencies"] }
shardtree = "0.8"

[target.'cfg(unix)'.dev-dependencies]
inferno = { version = "0.11", default-features = false, features = ["multithreaded", "nameattr"] }
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[lib]
bench = false

[features]
default = ["circuit", "multicore", "std", "zeroize"]
std = ["corez/std", "group/wnaf-memuse", "reddsa/std"]
circuit = ["dep:halo2_gadgets", "dep:halo2_proofs", "dep:tracing", "std"]
unstable-frost = []
unstable-voting-circuits = []
multicore = ["halo2_proofs?/multicore"]
dev-graph = ["halo2_proofs?/dev-graph", "image", "plotters"]
verifier-fingerprint = ["circuit", "halo2_proofs/unstable-verifier-fingerprint"]
test-dependencies = ["proptest", "rand/std", "rand/std_rng"]
zeroize = ["dep:zeroize", "pasta_curves/zeroize", "reddsa/zeroize", "zip32/zeroize"]

[[bench]]
name = "note_decryption"
harness = false
required-features = ["circuit"]

[[bench]]
name = "small"
harness = false

[[bench]]
name = "circuit"
harness = false
required-features = ["circuit"]

[[bench]]
name = "orchard_k11_prover"
harness = false
required-features = ["circuit"]

[profile.release]
debug = true

[profile.bench]
debug = true
